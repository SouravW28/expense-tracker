services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: expense-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: expense-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped